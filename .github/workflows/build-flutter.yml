name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      jobId:
        required: true
      userId:
        required: true
      payload:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ── 1. Parse payload ────────────────────────────────────────────────────
      - name: Parse payload
        id: parse
        run: |
          echo '${{ inputs.payload }}' > payload.json
          echo "mode=$(jq -r '.mode // "zip"' payload.json)"                 >> $GITHUB_OUTPUT
          echo "url=$(jq -r '.url // ""' payload.json)"                      >> $GITHUB_OUTPUT
          echo "build_type=$(jq -r '.buildType // "release"' payload.json)"  >> $GITHUB_OUTPUT
          echo "app_name=$(jq -r '.appName // "MyApp"' payload.json)"        >> $GITHUB_OUTPUT
          echo "icon_url=$(jq -r '.iconUrl // ""' payload.json)"             >> $GITHUB_OUTPUT

      # ── 2. Setup Java & Flutter ─────────────────────────────────────────────
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          cache: true

      # ════════════════════════════════════════════════════════════════════════
      # MODE ZIP — Build dari project Flutter yang diupload user
      # ════════════════════════════════════════════════════════════════════════
      - name: "[ZIP] Download & extract project"
        if: steps.parse.outputs.mode == 'zip'
        run: |
          wget -q -O project.zip "${{ steps.parse.outputs.url }}"
          unzip -q project.zip -d project

      - name: "[ZIP] Find Flutter root"
        if: steps.parse.outputs.mode == 'zip'
        id: root_zip
        run: |
          DIR=$(find project -name "pubspec.yaml" -maxdepth 5 | head -1 | xargs dirname)
          echo "dir=$DIR" >> $GITHUB_OUTPUT

      # ── AUTO UPGRADE: Gradle, AGP, Kotlin, SDK, pubspec ────────────────────
      - name: "[ZIP] Auto-upgrade build configs"
        if: steps.parse.outputs.mode == 'zip'
        working-directory: ${{ steps.root_zip.outputs.dir }}
        run: |
          ANDROID_DIR="android"

          # Versi target terbaru yang kompatibel dengan Flutter 3.47.4
          TARGET_GRADLE="8.14.0"
          TARGET_AGP="8.9.2"
          TARGET_KOTLIN="2.0.20"

          # ── 1. Gradle wrapper → 8.14.0 ─────────────────────────────────────
          WRAPPER="$ANDROID_DIR/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$WRAPPER" ]; then
            sed -i -E "s|gradle-[0-9][0-9.]*-[a-z]*\\.zip|gradle-${TARGET_GRADLE}-bin.zip|g" "$WRAPPER"
            echo "[OK] Gradle wrapper → $TARGET_GRADLE"
            grep distributionUrl "$WRAPPER"
          fi

          # ── 2. Patch versi AGP & Kotlin di SEMUA file gradle ───────────────
          FILES=""
          [ -f "$ANDROID_DIR/build.gradle" ]         && FILES="$FILES $ANDROID_DIR/build.gradle"
          [ -f "$ANDROID_DIR/build.gradle.kts" ]     && FILES="$FILES $ANDROID_DIR/build.gradle.kts"
          [ -f "$ANDROID_DIR/settings.gradle" ]      && FILES="$FILES $ANDROID_DIR/settings.gradle"
          [ -f "$ANDROID_DIR/settings.gradle.kts" ]  && FILES="$FILES $ANDROID_DIR/settings.gradle.kts"

          for F in $FILES; do
            echo "----- Patching $F -----"
            echo "SEBELUM:"; cat "$F"

            # AGP Groovy: com.android.tools.build:gradle:8.x.x
            sed -i -E "s|com\\.android\\.tools\\.build:gradle:[0-9]+\\.[0-9]+\\.[0-9]+|com.android.tools.build:gradle:${TARGET_AGP}|g" "$F"

            # AGP Kotlin DSL: id("com.android.application") version "8.x.x"
            sed -i -E "s|(id\\(\"com\\.android\\.application\"\\)[[:space:]]+version[[:space:]]+\")[0-9]+\\.[0-9]+\\.[0-9]+(\")|\\1${TARGET_AGP}\\2|g" "$F"
            sed -i -E "s|(id\\(\"com\\.android\\.library\"\\)[[:space:]]+version[[:space:]]+\")[0-9]+\\.[0-9]+\\.[0-9]+(\")|\\1${TARGET_AGP}\\2|g" "$F"

            # AGP tanpa kurung: id "com.android.application" version "8.x.x"
            sed -i -E "s|(id[[:space:]]+\"com\\.android\\.application\"[[:space:]]+version[[:space:]]+\")[0-9]+\\.[0-9]+\\.[0-9]+(\")|\\1${TARGET_AGP}\\2|g" "$F"
            sed -i -E "s|(id[[:space:]]+\"com\\.android\\.library\"[[:space:]]+version[[:space:]]+\")[0-9]+\\.[0-9]+\\.[0-9]+(\")|\\1${TARGET_AGP}\\2|g" "$F"

            # Kotlin plugin Groovy
            sed -i -E "s|org\\.jetbrains\\.kotlin:kotlin-gradle-plugin:[0-9]+\\.[0-9]+\\.[0-9]+|org.jetbrains.kotlin:kotlin-gradle-plugin:${TARGET_KOTLIN}|g" "$F"
            sed -i -E "s|kotlin_version[[:space:]]*=[[:space:]]*['\"][0-9]+\\.[0-9]+\\.[0-9]+['\"]|kotlin_version = '${TARGET_KOTLIN}'|g" "$F"

            # Kotlin plugin Kotlin DSL
            sed -i -E "s|(id\\(\"org\\.jetbrains\\.kotlin\\.android\"\\)[[:space:]]+version[[:space:]]+\")[0-9]+\\.[0-9]+\\.[0-9]+(\")|\\1${TARGET_KOTLIN}\\2|g" "$F"
            sed -i -E "s|(id\\(\"org\\.jetbrains\\.kotlin\\.jvm\"\\)[[:space:]]+version[[:space:]]+\")[0-9]+\\.[0-9]+\\.[0-9]+(\")|\\1${TARGET_KOTLIN}\\2|g" "$F"
            sed -i -E "s|(id[[:space:]]+\"org\\.jetbrains\\.kotlin\\.android\"[[:space:]]+version[[:space:]]+\")[0-9]+\\.[0-9]+\\.[0-9]+(\")|\\1${TARGET_KOTLIN}\\2|g" "$F"
            sed -i -E "s|(id[[:space:]]+\"org\\.jetbrains\\.kotlin\\.jvm\"[[:space:]]+version[[:space:]]+\")[0-9]+\\.[0-9]+\\.[0-9]+(\")|\\1${TARGET_KOTLIN}\\2|g" "$F"

            echo "SESUDAH:"; cat "$F"
          done

          # ── 3. compileSdk / targetSdk ──────────────────────────────────────
          APP_GRADLE="$ANDROID_DIR/app/build.gradle"
          if [ ! -f "$APP_GRADLE" ]; then
            APP_GRADLE="$ANDROID_DIR/app/build.gradle.kts"
          fi

          MIN_SDK=34
          MAX_SDK=35

          if [ -f "$APP_GRADLE" ]; then
            CURRENT=$(grep -oP '(?<=compileSdk\s)[0-9]+|(?<=compileSdkVersion\s)[0-9]+|(?<=compileSdk\s=\s)[0-9]+' "$APP_GRADLE" | head -1)
            CURRENT=${CURRENT:-0}
            echo "[INFO] compileSdk asli project: $CURRENT"

            if [ "$CURRENT" -lt "$MIN_SDK" ] || [ "$CURRENT" -gt "$MAX_SDK" ]; then
              TARGET_SDK=$MAX_SDK
              echo "[OK] compileSdk $CURRENT → $TARGET_SDK"
            else
              TARGET_SDK=$CURRENT
              echo "[OK] compileSdk $CURRENT sudah dalam range"
            fi

            sed -i "s/compileSdkVersion\s\+[0-9]\+/compileSdkVersion $TARGET_SDK/g" "$APP_GRADLE"
            sed -i "s/compileSdk\s\+[0-9]\+/compileSdk $TARGET_SDK/g"               "$APP_GRADLE"
            sed -i "s/compileSdk\s*=\s*[0-9]\+/compileSdk = $TARGET_SDK/g"          "$APP_GRADLE"
            sed -i "s/compileSdkVersion\s*=\s*[0-9]\+/compileSdkVersion = $TARGET_SDK/g" "$APP_GRADLE"

            sed -i "s/targetSdkVersion\s\+[0-9]\+/targetSdkVersion $TARGET_SDK/g"   "$APP_GRADLE"
            sed -i "s/targetSdk\s\+[0-9]\+/targetSdk $TARGET_SDK/g"                 "$APP_GRADLE"
            sed -i "s/targetSdk\s*=\s*[0-9]\+/targetSdk = $TARGET_SDK/g"            "$APP_GRADLE"
            sed -i "s/targetSdkVersion\s*=\s*[0-9]\+/targetSdkVersion = $TARGET_SDK/g" "$APP_GRADLE"

            sed -i 's/JavaVersion\.VERSION_1_[0-9]\+/JavaVersion.VERSION_17/g'      "$APP_GRADLE"
            sed -i 's/JavaVersion\.VERSION_[0-9]\+/JavaVersion.VERSION_17/g'        "$APP_GRADLE"
            sed -i 's/jvmTarget\s*=\s*"[0-9.]*"/jvmTarget = "17"/g'                 "$APP_GRADLE"
            sed -i 's/jvmTarget\s*=\s*JavaVersion\.VERSION_[0-9_]\+/jvmTarget = JavaVersion.VERSION_17/g' "$APP_GRADLE"

            echo "[OK] compileSdk/targetSdk final: $TARGET_SDK, Java → 17"
          fi

          # ── 4. gradle.properties: pastikan AndroidX & Jetifier aktif ───────
          GRADLE_PROPS="$ANDROID_DIR/gradle.properties"
          if [ -f "$GRADLE_PROPS" ]; then
            grep -q "^android.useAndroidX"      "$GRADLE_PROPS" || echo "android.useAndroidX=true"      >> "$GRADLE_PROPS"
            grep -q "^android.enableJetifier"   "$GRADLE_PROPS" || echo "android.enableJetifier=true"   >> "$GRADLE_PROPS"
            grep -q "^org.gradle.jvmargs"       "$GRADLE_PROPS" || echo "org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G" >> "$GRADLE_PROPS"
            echo "[OK] gradle.properties dipastikan"
          fi

          # ── 5. pubspec.yaml: SESUAIKAN SDK CONSTRAINT ──────────────────────
          PUBSPEC="pubspec.yaml"
          if [ -f "$PUBSPEC" ]; then
            echo "[INFO] pubspec sdk constraint SEBELUM:"
            grep -E "^\s*sdk:" "$PUBSPEC" | head -3

            sed -i -E "s|sdk:\s*['\"]>=[0-9.]+\s*<[0-9.]+\s*['\"]|sdk: '>=3.8.0 <4.0.0'|g" "$PUBSPEC"
            sed -i -E "s|sdk:\s*['\"]\^[0-9.]+['\"]|sdk: '>=3.8.0 <4.0.0'|g"              "$PUBSPEC"
            sed -i -E "s|sdk:\s*['\"]>=[0-9.]+['\"]|sdk: '>=3.8.0 <4.0.0'|g"              "$PUBSPEC"

            echo "[OK] pubspec sdk constraint → >=3.8.0 <4.0.0"
            grep -E "^\s*sdk:" "$PUBSPEC" | head -3
          fi

          # ── 6. Hapus lock lama & pub get ───────────────────────────────────
          rm -f pubspec.lock
          flutter pub get 2>&1 || {
            echo "[WARN] pub get gagal, coba pub upgrade"
            flutter pub upgrade || true
          }

      # ── DEBUG: tampilkan versi SDK & config ────────────────────────────────
      - name: "[ZIP] Debug SDK versions"
        if: steps.parse.outputs.mode == 'zip'
        working-directory: ${{ steps.root_zip.outputs.dir }}
        run: |
          echo "===== Flutter version ====="
          flutter --version
          echo "===== Dart version ====="
          dart --version
          echo "===== pubspec environment ====="
          grep -A 3 "^environment:" pubspec.yaml || echo "no environment block"
          echo "===== Gradle wrapper ====="
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties || true
          echo "===== build.gradle.kts (root) ====="
          cat android/build.gradle.kts 2>/dev/null || cat android/build.gradle 2>/dev/null || true
          echo "===== settings.gradle.kts ====="
          cat android/settings.gradle.kts 2>/dev/null || cat android/settings.gradle 2>/dev/null || true

      - name: "[ZIP] Flutter pub get"
        if: steps.parse.outputs.mode == 'zip'
        working-directory: ${{ steps.root_zip.outputs.dir }}
        run: flutter pub get

      - name: "[ZIP] Build APK"
        if: steps.parse.outputs.mode == 'zip'
        working-directory: ${{ steps.root_zip.outputs.dir }}
        run: flutter build apk --${{ steps.parse.outputs.build_type }} --no-tree-shake-icons

      - name: "[ZIP] Upload APK artifact"
        if: steps.parse.outputs.mode == 'zip'
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.jobId }}
          path: ${{ steps.root_zip.outputs.dir }}/build/app/outputs/flutter-apk/*.apk
          retention-days: 1

      # ════════════════════════════════════════════════════════════════════════
      # MODE URL — Web2APK: wrap website ke dalam Flutter WebView APK
      # ════════════════════════════════════════════════════════════════════════
      - name: "[URL] Create Flutter WebView project"
        if: steps.parse.outputs.mode == 'url'
        run: |
          flutter create --org com.gojocrasher --project-name webview_app webview_project
          cd webview_project
          flutter pub add webview_flutter

      - name: "[URL] Patch main.dart"
        if: steps.parse.outputs.mode == 'url'
        run: |
          cat > webview_project/lib/main.dart << 'DART'
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          void main() => runApp(const MyApp());

          class MyApp extends StatelessWidget {
            const MyApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: '${{ steps.parse.outputs.app_name }}',
                home: const WebViewPage(),
              );
            }
          }

          class WebViewPage extends StatefulWidget {
            const WebViewPage({super.key});
            @override
            State<WebViewPage> createState() => _WebViewPageState();
          }

          class _WebViewPageState extends State<WebViewPage> {
            late final WebViewController _controller;
            @override
            void initState() {
              super.initState();
              _controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..loadRequest(Uri.parse('${{ steps.parse.outputs.url }}'));
            }
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(child: WebViewWidget(controller: _controller)),
              );
            }
          }
          DART

      - name: "[URL] Patch app name"
        if: steps.parse.outputs.mode == 'url'
        run: |
          APP="${{ steps.parse.outputs.app_name }}"
          sed -i "s/android:label=\"[^\"]*\"/android:label=\"${APP}\"/" \
            webview_project/android/app/src/main/AndroidManifest.xml

      - name: "[URL] Download & apply custom icon"
        if: steps.parse.outputs.mode == 'url' && steps.parse.outputs.icon_url != ''
        run: |
          wget -q -O icon_raw "${{ steps.parse.outputs.icon_url }}"
          sudo apt-get install -y imagemagick -q
          for size in 48 72 96 144 192; do
            case $size in
              48)  dir="mipmap-mdpi"    ;;
              72)  dir="mipmap-hdpi"    ;;
              96)  dir="mipmap-xhdpi"   ;;
              144) dir="mipmap-xxhdpi"  ;;
              192) dir="mipmap-xxxhdpi" ;;
            esac
            TARGET="webview_project/android/app/src/main/res/${dir}"
            mkdir -p "$TARGET"
            convert icon_raw -resize ${size}x${size} "$TARGET/ic_launcher.png"
          done

      - name: "[URL] Flutter pub get"
        if: steps.parse.outputs.mode == 'url'
        working-directory: webview_project
        run: flutter pub get

      - name: "[URL] Build APK"
        if: steps.parse.outputs.mode == 'url'
        working-directory: webview_project
        run: flutter build apk --release --no-tree-shake-icons

      - name: "[URL] Upload APK artifact"
        if: steps.parse.outputs.mode == 'url'
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.jobId }}
          path: webview_project/build/app/outputs/flutter-apk/*.apk
          retention-days: 1