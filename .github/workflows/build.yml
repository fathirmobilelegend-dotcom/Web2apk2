name: Build Flutter APK (Full Auto-Fix)

on:
  push:
    branches:
      - build
    paths:
      - 'flutter-project.zip'
      - 'build-config.json'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'debug / release'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m"
  JAVA_TOOL_OPTIONS: "-Xmx4096m"

jobs:
  preflight:
    name: 🔍 Preflight Check
    runs-on: ubuntu-latest
    outputs:
      build_type: ${{ steps.cfg.outputs.build_type }}
      flutter_version: ${{ steps.detect.outputs.flutter_version }}
      has_pubspec: ${{ steps.extract.outputs.has_pubspec }}
      project_size: ${{ steps.extract.outputs.project_size }}
    steps:
      - uses: actions/checkout@v4

      - name: 📄 Read Build Config
        id: cfg
        run: |
          if [ -f build-config.json ]; then
            BT=$(jq -r .build_type build-config.json)
            echo "build_type=$BT" >> $GITHUB_OUTPUT
            echo "🎯 Build type: $BT"
          else
            echo "build_type=${{ github.event.inputs.build_type || 'release' }}" >> $GITHUB_OUTPUT
          fi

      - name: 📦 Extract & Validate ZIP
        id: extract
        run: |
          mkdir -p /tmp/flutter-check
          if [ ! -f flutter-project.zip ]; then
            echo "has_pubspec=false" >> $GITHUB_OUTPUT
            echo "❌ flutter-project.zip tidak ada"
            exit 1
          fi
          unzip -q flutter-project.zip -d /tmp/flutter-check 2>/dev/null || true
          SIZE=$(du -sm /tmp/flutter-check 2>/dev/null | cut -f1 || echo "0")
          echo "project_size=${SIZE}MB" >> $GITHUB_OUTPUT

          PUB=$(find /tmp/flutter-check -maxdepth 3 -name pubspec.yaml | head -n1)
          if [ -n "$PUB" ]; then
            echo "has_pubspec=true" >> $GITHUB_OUTPUT
            echo "✅ Found: $PUB"
          else
            echo "has_pubspec=false" >> $GITHUB_OUTPUT
            echo "❌ pubspec.yaml tidak ada"
          fi

      - name: 🎯 Detect Optimal Flutter Version
        id: detect
        run: |
          PUB=$(find /tmp/flutter-check -maxdepth 3 -name pubspec.yaml | head -n1)
          if [ -z "$PUB" ]; then
            echo "flutter_version=3.24.0" >> $GITHUB_OUTPUT
            exit 0
          fi

          SDK_LINE=$(grep -A3 '^environment:' "$PUB" | grep 'sdk:' | head -n1 | sed 's/.*sdk:[[:space:]]*//; s/["'\'']//g' || true)
          DART_VER=$(echo "$SDK_LINE" | grep -oE '[0-9]+\.[0-9]+' | head -n1 || echo "")

          FV="3.24.0"

          case "$DART_VER" in
            "3.15"*) FV="3.35.2" ;;
            "3.14"*) FV="3.35.2" ;;
            "3.13"*) FV="3.35.2" ;;
            "3.12"*) FV="3.35.2" ;;
            "3.11"*) FV="3.35.2" ;;
            "3.10"*) FV="3.35.2" ;;
            "3.9"*)  FV="3.35.2" ;;
            "3.8"*)  FV="3.32.0" ;;
            "3.7"*)  FV="3.29.0" ;;
            "3.6"*)  FV="3.27.0" ;;
            "3.5"*)  FV="3.24.0" ;;
            "3.4"*)  FV="3.22.0" ;;
            "3.3"*)  FV="3.19.0" ;;
            "3.2"*)  FV="3.16.0" ;;
            "3.1"*)  FV="3.13.0" ;;
            "3.0"*)  FV="3.10.0" ;;
          esac

          NEED_HIGH=false
          if grep -Eq 'webview_flutter:[[:space:]]*(\^|>=)?(4\.1[5-9]|[5-9])' "$PUB"; then NEED_HIGH=true; fi
          if grep -Eq 'geolocator:[[:space:]]*(\^|>=)?1[4-9]\.' "$PUB"; then NEED_HIGH=true; fi
          if grep -Eq 'firebase_core:[[:space:]]*(\^|>=)?3\.' "$PUB"; then NEED_HIGH=true; fi
          if grep -Eq 'firebase_auth:[[:space:]]*(\^|>=)?5\.' "$PUB"; then NEED_HIGH=true; fi
          if grep -Eq 'cloud_firestore:[[:space:]]*(\^|>=)?5\.' "$PUB"; then NEED_HIGH=true; fi
          if grep -Eq 'image_picker:[[:space:]]*(\^|>=)?1\.(2[0-9]|[3-9][0-9])' "$PUB"; then NEED_HIGH=true; fi
          if grep -Eq 'file_picker:[[:space:]]*(\^|>=)?[8-9]\.' "$PUB"; then NEED_HIGH=true; fi
          if grep -Eq 'permission_handler:[[:space:]]*(\^|>=)?12\.' "$PUB"; then NEED_HIGH=true; fi
          if grep -Eq 'flutter_local_notifications:[[:space:]]*(\^|>=)?1[7-9]\.' "$PUB"; then NEED_HIGH=true; fi
          if grep -Eq 'workmanager:[[:space:]]*(\^|>=)?0\.[6-9]' "$PUB"; then NEED_HIGH=true; fi
          if grep -Eq 'google_maps_flutter:[[:space:]]*(\^|>=)?(2\.1[0-9]|[3-9])' "$PUB"; then NEED_HIGH=true; fi
          if grep -Eq 'dio:[[:space:]]*(\^|>=)?5\.' "$PUB"; then NEED_HIGH=true; fi
          if grep -Eq 'video_player:[[:space:]]*(\^|>=)?2\.[8-9]' "$PUB"; then NEED_HIGH=true; fi
          if grep -Eq 'sqflite:[[:space:]]*(\^|>=)?2\.[4-9]' "$PUB"; then NEED_HIGH=true; fi
          if grep -Eq 'shared_preferences:[[:space:]]*(\^|>=)?2\.[3-9]' "$PUB"; then NEED_HIGH=true; fi
          if grep -Eq 'url_launcher:[[:space:]]*(\^|>=)?6\.[2-9]' "$PUB"; then NEED_HIGH=true; fi
          if grep -Eq 'intl:[[:space:]]*(\^|>=)?0\.(19|20)' "$PUB"; then NEED_HIGH=true; fi

          if [ "$NEED_HIGH" = "true" ]; then
            FV="3.35.2"
            echo "⚠️ Plugin butuh versi tinggi → override ke 3.35.2"
          fi

          echo "flutter_version=$FV" >> $GITHUB_OUTPUT
          echo "🎯 Using Flutter: $FV"

  build:
    name: 🔨 Build APK
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: 📱 Install Android SDK Platform 35 & 36
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" "platform-tools" || true
          sdkmanager --list_installed | grep -E "platforms|build-tools" || true

      - name: 📚 Install System Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick jq unzip curl file xxd zip p7zip-full

      - name: 💾 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('flutter-project.zip') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 💾 Cache Pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('flutter-project.zip') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: 📄 Read Config
        run: |
          if [ -f build-config.json ]; then
            cat build-config.json
            echo "type=$(jq -r .type build-config.json)" >> $GITHUB_ENV
            echo "build_type=$(jq -r .build_type build-config.json)" >> $GITHUB_ENV
          else
            echo "type=flutter" >> $GITHUB_ENV
            echo "build_type=release" >> $GITHUB_ENV
          fi

      - name: 🔐 Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass password \
            -keypass password \
            -dname "CN=BuildBot, OU=Dev, O=BuildBot, L=City, S=State, C=ID"

      - name: 📦 Extract & Lock Project Dir
        run: |
          rm -rf flutter-project
          mkdir -p flutter-project

          if [ ! -f flutter-project.zip ]; then
            echo "❌ flutter-project.zip tidak ada!"
            exit 1
          fi

          unzip -q flutter-project.zip -d flutter-project || {
            echo "❌ Gagal extract ZIP"
            exit 1
          }

          PUBSPEC_PATH=$(find flutter-project -maxdepth 3 -name pubspec.yaml | head -n1)
          if [ -z "$PUBSPEC_PATH" ]; then
            echo "❌ pubspec.yaml tidak ditemukan"
            find flutter-project -maxdepth 3 -type f | head -30
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$PUBSPEC_PATH")
          echo "🎯 Project root: $PROJECT_ROOT"

          if [ "$PROJECT_ROOT" != "flutter-project" ]; then
            TMP=$(mktemp -d)
            cp -R "$PROJECT_ROOT"/. "$TMP"/
            rm -rf flutter-project
            mkdir -p flutter-project
            cp -R "$TMP"/. flutter-project/
          fi

          echo "✅ Project locked"
          ls flutter-project | head -20

      - name: 🎯 Setup Flutter ${{ needs.preflight.outputs.flutter_version }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.preflight.outputs.flutter_version }}
          channel: stable
          cache: true

      - name: 📊 Flutter Version
        run: flutter --version

      - name: 🖼️ Fix App Icons
        run: |
          cd flutter-project
          MIPMAP_DIRS="mipmap-hdpi mipmap-mdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi"
          NEEDS_REGEN=false
          for dir in $MIPMAP_DIRS; do
            PNG="android/app/src/main/res/$dir/ic_launcher.png"
            if [ ! -f "$PNG" ]; then
              NEEDS_REGEN=true
              break
            fi
            if ! file "$PNG" | grep -q PNG || ! identify "$PNG" &>/dev/null; then
              NEEDS_REGEN=true
              break
            fi
          done
          if [ "$NEEDS_REGEN" = "false" ]; then
            echo "✅ Icons all valid, skip"
            exit 0
          fi
          echo "🔧 Regenerating icons..."
          if [ -f ../build-assets/icon.png ] && file ../build-assets/icon.png | grep -q PNG; then
            ICON_SRC="../build-assets/icon.png"
          else
            convert -size 512x512 xc:blue ../build-assets/icon.png
            ICON_SRC="../build-assets/icon.png"
          fi
          for pair in "hdpi 72" "mdpi 48" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $pair
            DIR="android/app/src/main/res/mipmap-$1"
            mkdir -p "$DIR"
            convert "$ICON_SRC" -resize ${2}x${2} "$DIR/ic_launcher.png"
            cp "$DIR/ic_launcher.png" "$DIR/ic_launcher_round.png"
          done
          echo "✅ Icons regenerated"

      - name: 📝 Fix AndroidManifest
        run: |
          cd flutter-project
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ ! -f "$MANIFEST" ]; then
            echo "⚠️ AndroidManifest.xml tidak ada, skip"
            exit 0
          fi
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n\n    <application|' "$MANIFEST" || true
          fi
          echo "✅ Manifest checked"

      # ⭐ FIX compileSdk 36 + Java 17 + Kotlin jvmTarget 17 (tanpa Python heredoc)
      - name: 🛠️ Fix Android Config (compileSdk 36 + JVM 17)
        run: |
          cd flutter-project/android
          cp ../../release.keystore app/ 2>/dev/null || cp ../release.keystore app/ 2>/dev/null || true

          for f in app/build.gradle app/build.gradle.kts; do
            [ -f "$f" ] || continue
            echo "🔧 Patching $f"

            sed -i -E 's/(compileSdk(Version)?)[[:space:]]*=?[[:space:]]*[0-9]+/\1 36/g' "$f" || true
            sed -i -E 's/compileSdkVersion[[:space:]]*[0-9]+/compileSdkVersion 36/g' "$f" || true
            sed -i -E 's/compileSdk[[:space:]]*=[[:space:]]*[0-9]+/compileSdk = 36/g' "$f" || true

            sed -i -E 's/(targetSdk(Version)?)[[:space:]]*=?[[:space:]]*[0-9]+/\1 36/g' "$f" || true
            sed -i -E 's/targetSdk[[:space:]]*=[[:space:]]*[0-9]+/targetSdk = 36/g' "$f" || true

            sed -i -E 's/(minSdk(Version)?)[[:space:]]*=?[[:space:]]*[0-9]+/\1 21/g' "$f" || true
            sed -i -E 's/minSdk[[:space:]]*=[[:space:]]*[0-9]+/minSdk = 21/g' "$f" || true

            sed -i 's|storeFile file(".*")|storeFile file("release.keystore")|g' "$f" || true
            sed -i 's|storeFile = file(".*")|storeFile = file("release.keystore")|g' "$f" || true
            sed -i 's|storePassword ".*"|storePassword "password"|g' "$f" || true
            sed -i 's|storePassword = ".*"|storePassword = "password"|g' "$f" || true
            sed -i 's|keyAlias ".*"|keyAlias "release"|g' "$f" || true
            sed -i 's|keyAlias = ".*"|keyAlias = "release"|g' "$f" || true
            sed -i 's|keyPassword ".*"|keyPassword "password"|g' "$f" || true
            sed -i 's|keyPassword = ".*"|keyPassword = "password"|g' "$f" || true

            sed -i -E 's/sourceCompatibility[[:space:]]+JavaVersion\.VERSION_[0-9_]+/sourceCompatibility JavaVersion.VERSION_17/g' "$f" || true
            sed -i -E 's/targetCompatibility[[:space:]]+JavaVersion\.VERSION_[0-9_]+/targetCompatibility JavaVersion.VERSION_17/g' "$f" || true
            sed -i -E 's/sourceCompatibility[[:space:]]*=[[:space:]]*JavaVersion\.VERSION_[0-9_]+/sourceCompatibility = JavaVersion.VERSION_17/g' "$f" || true
            sed -i -E 's/targetCompatibility[[:space:]]*=[[:space:]]*JavaVersion\.VERSION_[0-9_]+/targetCompatibility = JavaVersion.VERSION_17/g' "$f" || true
          done

          # Fix Kotlin JVM target 17 (pakai awk, bukan python)
          APP_GRADLE="app/build.gradle"
          if [ -f "$APP_GRADLE" ]; then
            if grep -q "kotlinOptions" "$APP_GRADLE"; then
              echo "🔧 kotlinOptions sudah ada, patch jvmTarget jadi 17"
              sed -i -E 's/jvmTarget[[:space:]]*=[[:space:]]*.+$/jvmTarget = "17"/g' "$APP_GRADLE" || true
            else
              echo "🔧 Inject kotlinOptions { jvmTarget = 17 } ke app/build.gradle"
              awk '/^[[:space:]]*android[[:space:]]*[{]/ && !done { print; print "    kotlinOptions {"; print "        jvmTarget = \"17\""; print "    }"; done=1; next } { print }' "$APP_GRADLE" > "${APP_GRADLE}.tmp" && mv "${APP_GRADLE}.tmp" "$APP_GRADLE"
            fi
          fi

          APP_GRADLE_KTS="app/build.gradle.kts"
          if [ -f "$APP_GRADLE_KTS" ]; then
            if grep -q "kotlinOptions" "$APP_GRADLE_KTS"; then
              echo "🔧 kotlinOptions .kts sudah ada, patch jvmTarget"
              sed -i -E 's/jvmTarget[[:space:]]*=[[:space:]]*.+$/jvmTarget = "17"/g' "$APP_GRADLE_KTS" || true
            else
              awk '/^[[:space:]]*android[[:space:]]*[{]/ && !done { print; print "    kotlinOptions {"; print "        jvmTarget = \"17\""; print "    }"; done=1; next } { print }' "$APP_GRADLE_KTS" > "${APP_GRADLE_KTS}.tmp" && mv "${APP_GRADLE_KTS}.tmp" "$APP_GRADLE_KTS"
            fi
          fi

          echo "=== Hasil patch ==="
          grep -nE "compileSdk|targetSdk|minSdk|jvmTarget|kotlinOptions" app/build.gradle* || true
          echo "==================="
          echo "✅ Android config fixed"

      - name: 🔧 Patch AGP + Kotlin
        run: |
          cd flutter-project

          FV=$(flutter --version 2>/dev/null | grep -oE 'Flutter [0-9]+\.[0-9]+\.[0-9]+' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1 || echo "3.24.0")
          FLUTTER_MINOR=$(echo "$FV" | cut -d. -f2)
          [ -z "$FLUTTER_MINOR" ] && FLUTTER_MINOR=0

          TARGET_AGP="8.3.0"
          TARGET_KOTLIN="1.9.0"
          if [ "$FLUTTER_MINOR" -ge 35 ] 2>/dev/null; then
            TARGET_AGP="8.11.1"; TARGET_KOTLIN="2.2.20"
          elif [ "$FLUTTER_MINOR" -ge 32 ] 2>/dev/null; then
            TARGET_AGP="8.9.1"; TARGET_KOTLIN="2.1.0"
          elif [ "$FLUTTER_MINOR" -ge 27 ] 2>/dev/null; then
            TARGET_AGP="8.7.0"; TARGET_KOTLIN="2.0.20"
          elif [ "$FLUTTER_MINOR" -ge 22 ] 2>/dev/null; then
            TARGET_AGP="8.3.0"; TARGET_KOTLIN="1.9.0"
          elif [ "$FLUTTER_MINOR" -ge 19 ] 2>/dev/null; then
            TARGET_AGP="7.4.2"; TARGET_KOTLIN="1.8.22"
          else
            TARGET_AGP="7.4.2"; TARGET_KOTLIN="1.8.10"
          fi

          echo "🎯 Flutter $FV → AGP=$TARGET_AGP Kotlin=$TARGET_KOTLIN"

          for f in android/settings.gradle android/settings.gradle.kts; do
            [ -f "$f" ] || continue
            sed -i -E "s|(id[[:space:]]*\(?[[:space:]]*[\"']com\.android\.application[\"'][[:space:]]*\)?[[:space:]]+version[[:space:]]+)[\"'][0-9.]+[\"']|\1\"${TARGET_AGP}\"|g" "$f" || true
            sed -i -E "s|(id[[:space:]]*\(?[[:space:]]*[\"']com\.android\.library[\"'][[:space:]]*\)?[[:space:]]+version[[:space:]]+)[\"'][0-9.]+[\"']|\1\"${TARGET_AGP}\"|g" "$f" || true
            sed -i -E "s|(id[[:space:]]*\(?[[:space:]]*[\"']org\.jetbrains\.kotlin\.android[\"'][[:space:]]*\)?[[:space:]]+version[[:space:]]+)[\"'][0-9.]+[\"']|\1\"${TARGET_KOTLIN}\"|g" "$f" || true
          done

          for f in android/build.gradle android/build.gradle.kts; do
            [ -f "$f" ] || continue
            sed -i -E "s|com\.android\.tools\.build:gradle:[0-9.]+|com.android.tools.build:gradle:${TARGET_AGP}|g" "$f" || true
            sed -i -E "s|org\.jetbrains\.kotlin:kotlin-gradle-plugin:[0-9.]+|org.jetbrains.kotlin:kotlin-gradle-plugin:${TARGET_KOTLIN}|g" "$f" || true
            sed -i -E "s|ext\.kotlin_version[[:space:]]*=[[:space:]]*[\"'][0-9.]+[\"']|ext.kotlin_version = '${TARGET_KOTLIN}'|g" "$f" || true
          done

          echo "✅ AGP + Kotlin patched"
          echo "PATCHED_AGP=$TARGET_AGP" >> $GITHUB_ENV
          echo "PATCHED_KOTLIN=$TARGET_KOTLIN" >> $GITHUB_ENV

      - name: 🔗 Sync Gradle Wrapper
        run: |
          cd flutter-project/android

          AGP_VER="${PATCHED_AGP:-}"
          echo "🔍 PATCHED_AGP: '${AGP_VER}'"

          if [ -z "$AGP_VER" ]; then
            for f in build.gradle build.gradle.kts app/build.gradle app/build.gradle.kts settings.gradle settings.gradle.kts; do
              [ -f "$f" ] || continue
              V=$(grep -oP "com\.android\.tools\.build:gradle:\K[0-9]+\.[0-9]+(\.[0-9]+)?" "$f" 2>/dev/null | head -n1 || true)
              [ -z "$V" ] && V=$(grep -oP "id\(['\"]com\.android\.application['\"]\)\s+version\s+['\"]?\K[0-9]+\.[0-9]+(\.[0-9]+)?" "$f" 2>/dev/null | head -n1 || true)
              if [ -n "$V" ]; then AGP_VER="$V"; break; fi
            done
          fi

          [ -z "$AGP_VER" ] && AGP_VER="8.7.0"
          echo "🎯 AGP version: $AGP_VER"

          MAJOR=$(echo $AGP_VER | cut -d. -f1)
          MINOR=$(echo $AGP_VER | cut -d. -f2)

          case "${MAJOR}.${MINOR}" in
            8.13) GRADLE_REQ="8.14" ;;
            8.12) GRADLE_REQ="8.13" ;;
            8.11) GRADLE_REQ="8.13" ;;
            8.10) GRADLE_REQ="8.11.1" ;;
            8.9)  GRADLE_REQ="8.11.1" ;;
            8.8)  GRADLE_REQ="8.10.2" ;;
            8.7)  GRADLE_REQ="8.9" ;;
            8.6)  GRADLE_REQ="8.7" ;;
            8.5)  GRADLE_REQ="8.7" ;;
            8.4)  GRADLE_REQ="8.6" ;;
            8.3)  GRADLE_REQ="8.4" ;;
            8.2)  GRADLE_REQ="8.2" ;;
            8.1)  GRADLE_REQ="8.0" ;;
            8.0)  GRADLE_REQ="8.0" ;;
            7.*)  GRADLE_REQ="7.6.3" ;;
            *)    GRADLE_REQ="8.13" ;;
          esac
          echo "🎯 Gradle wrapper → $GRADLE_REQ"

          mkdir -p gradle/wrapper
          cat > gradle/wrapper/gradle-wrapper.properties <<PROPS_EOF
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https://services.gradle.org/distributions/gradle-${GRADLE_REQ}-all.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          PROPS_EOF

          cat gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew 2>/dev/null || true

      - name: ⚙️ Fix Gradle Properties
        run: |
          cd flutter-project/android
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.configureondemand=true
          org.gradle.daemon=false
          android.useAndroidX=true
          android.enableJetifier=true
          android.nonTransitiveRClass=false
          android.nonFinalResIds=false
          android.suppressUnsupportedCompileSdk=36
          kotlin.daemon.jvmargs=-Xmx2048m
          kotlin.jvm.target.validation.mode=warning
          EOF
          echo "✅ gradle.properties fixed"

      - name: 📚 Flutter Pub Get (Auto-Fix)
        shell: bash
        run: |
          cd flutter-project
          PUB_LOG="pubget.log"
          MAX=6
          N=0
          SUCCESS=false

          auto_fix_pubspec() {
            FIXED=false
            if grep -qE "requires SDK version|requires Dart SDK" "$PUB_LOG" 2>/dev/null; then
              sed -i -E "s|sdk:[[:space:]]*['\"]?[>=^~ ]*3\.[0-9.]+[^'\"]*['\"]?|sdk: '>=3.6.0 <4.0.0'|g" pubspec.yaml || true
              FIXED=true
            fi
            if grep -q "webview_flutter" "$PUB_LOG" 2>/dev/null && grep -q "requires SDK" "$PUB_LOG" 2>/dev/null; then
              sed -i -E "s|webview_flutter:[[:space:]]*[^[:space:]]+|webview_flutter: ^4.13.0|g" pubspec.yaml || true
              FIXED=true
            fi
            if grep -q "geolocator" "$PUB_LOG" 2>/dev/null && grep -qE "toARGB32|geolocator_android" "$PUB_LOG" 2>/dev/null; then
              sed -i -E "s|geolocator:[[:space:]]*[^[:space:]]+|geolocator: ^13.0.4|g" pubspec.yaml || true
              FIXED=true
            fi
            if grep -q "firebase_core" "$PUB_LOG" 2>/dev/null && grep -q "requires SDK" "$PUB_LOG" 2>/dev/null; then
              sed -i -E "s|firebase_core:[[:space:]]*[^[:space:]]+|firebase_core: ^2.32.0|g" pubspec.yaml || true
              FIXED=true
            fi
            if grep -q "image_picker" "$PUB_LOG" 2>/dev/null && grep -q "requires SDK" "$PUB_LOG" 2>/dev/null; then
              sed -i -E "s|image_picker:[[:space:]]*[^[:space:]]+|image_picker: ^1.1.2|g" pubspec.yaml || true
              FIXED=true
            fi
            if grep -q "file_picker" "$PUB_LOG" 2>/dev/null && grep -q "requires SDK" "$PUB_LOG" 2>/dev/null; then
              sed -i -E "s|file_picker:[[:space:]]*[^[:space:]]+|file_picker: ^6.2.1|g" pubspec.yaml || true
              FIXED=true
            fi
            if grep -q "permission_handler" "$PUB_LOG" 2>/dev/null && grep -q "requires SDK" "$PUB_LOG" 2>/dev/null; then
              sed -i -E "s|permission_handler:[[:space:]]*[^[:space:]]+|permission_handler: ^11.3.1|g" pubspec.yaml || true
              FIXED=true
            fi
            if grep -q "flutter_local_notifications" "$PUB_LOG" 2>/dev/null && grep -q "requires SDK" "$PUB_LOG" 2>/dev/null; then
              sed -i -E "s|flutter_local_notifications:[[:space:]]*[^[:space:]]+|flutter_local_notifications: ^17.2.4|g" pubspec.yaml || true
              FIXED=true
            fi
            if grep -q "workmanager" "$PUB_LOG" 2>/dev/null && grep -q "requires SDK" "$PUB_LOG" 2>/dev/null; then
              sed -i -E "s|workmanager:[[:space:]]*[^[:space:]]+|workmanager: ^0.5.2|g" pubspec.yaml || true
              FIXED=true
            fi
            if grep -q "google_maps_flutter" "$PUB_LOG" 2>/dev/null && grep -q "requires SDK" "$PUB_LOG" 2>/dev/null; then
              sed -i -E "s|google_maps_flutter:[[:space:]]*[^[:space:]]+|google_maps_flutter: ^2.9.0|g" pubspec.yaml || true
              FIXED=true
            fi
            if grep -q "overrides" "$PUB_LOG" 2>/dev/null; then
              sed -i '/^dependency_overrides:/,/^[^ ]/d' pubspec.yaml || true
              FIXED=true
            fi
            if [ "$FIXED" = "true" ]; then
              rm -f pubspec.lock
            fi
            return 0
          }

          while [ $N -lt $MAX ] && [ "$SUCCESS" = "false" ]; do
            N=$((N+1))
            echo "===== pub get attempt $N / $MAX ====="
            if flutter pub get 2>&1 | tee "$PUB_LOG"; then
              SUCCESS=true
              echo "✅ pub get OK"
            else
              echo "❌ pub get failed"
              auto_fix_pubspec
              rm -f pubspec.lock
              sleep 5
            fi
          done

          if [ "$SUCCESS" = "false" ]; then
            echo "❌ pub get failed setelah $MAX attempts"
            tail -100 "$PUB_LOG"
            exit 1
          fi

      - name: 🔍 Flutter Analyze (informative)
        continue-on-error: true
        run: |
          cd flutter-project
          flutter analyze 2>&1 | head -80 || true

      - name: 🔨 Build APK
        id: build
        shell: bash
        run: |
          cd flutter-project
          MODE="${build_type:-release}"
          echo "🎯 Build mode: $MODE"

          MAX=3
          N=0
          SUCCESS=false

          while [ $N -lt $MAX ] && [ "$SUCCESS" = "false" ]; do
            N=$((N+1))
            echo "===== Build attempt $N / $MAX ====="

            if [ "$MODE" = "release" ]; then
              flutter build apk --release --no-tree-shake-icons 2>&1 | tee build.log
            else
              flutter build apk --debug 2>&1 | tee build.log
            fi

            if [ -f "build/app/outputs/flutter-apk/app-${MODE}.apk" ] || \
               [ -f "build/app/outputs/flutter-apk/app-release.apk" ] || \
               [ -f "build/app/outputs/flutter-apk/app-debug.apk" ]; then
              SUCCESS=true
              echo "✅ Build success"
              break
            fi

            echo "❌ Build failed, cleaning..."
            flutter clean >/dev/null 2>&1 || true
            rm -rf build .dart_tool
            sleep 5
          done

          if [ "$SUCCESS" = "false" ]; then
            echo "❌ Build failed setelah $MAX attempts"
            tail -100 build.log
            exit 1
          fi

          ls -la build/app/outputs/flutter-apk/ || true

      - name: 🔏 Sign APK
        if: env.build_type == 'release'
        run: |
          APK=$(find flutter-project/build/app/outputs/flutter-apk -name "*.apk" | head -n1)
          if [ -z "$APK" ]; then
            echo "❌ APK tidak ada"
            exit 1
          fi
          BT=$(ls $ANDROID_HOME/build-tools | sort -V | tail -n1)
          $ANDROID_HOME/build-tools/$BT/apksigner sign --ks release.keystore --ks-pass pass:password --key-pass pass:password "$APK" || true
          $ANDROID_HOME/build-tools/$BT/apksigner verify "$APK" || true

      - name: 📦 Collect APK
        run: |
          mkdir -p output
          APK=$(find flutter-project/build/app/outputs/flutter-apk -name "*.apk" | head -n1)
          if [ -z "$APK" ]; then
            echo "❌ APK tidak ditemukan!"
            find . -name "*.apk"
            exit 1
          fi
          cp "$APK" output/app-release.apk
          ls -la output/

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: output/app-release.apk
          retention-days: 1
          if-no-files-found: error

      - name: 📊 Build Summary
        if: always()
        run: |
          echo "════════════════════════════════════════"
          echo "Build Type     : ${{ env.build_type }}"
          echo "Flutter Version: ${{ needs.preflight.outputs.flutter_version }}"
          echo "Status         : ${{ job.status }}"
          echo "════════════════════════════════════════"
