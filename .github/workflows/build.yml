name: Build Flutter APK

on:
  push:
    branches:
      - build
    paths:
      - 'flutter-project.zip'
      - 'build-config.json'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'debug / release'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:

      # ==========================================================
      # 1. CHECKOUT & SETUP
      # ==========================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick jq unzip curl file

      # ==========================================================
      # 2. READ BUILD CONFIG
      # ==========================================================
      - name: Read Build Configuration
        run: |
          if [ -f build-config.json ]; then
            echo "type=$(jq -r .type build-config.json)" >> $GITHUB_ENV
            echo "build_type=$(jq -r .build_type build-config.json)" >> $GITHUB_ENV
            cat build-config.json
          else
            echo "type=flutter" >> $GITHUB_ENV
            echo "build_type=${{ github.event.inputs.build_type || 'release' }}" >> $GITHUB_ENV
          fi
          echo "=== Env: type=${{ env.type }} build_type=${{ env.build_type }} ==="

      # ==========================================================
      # 3. GENERATE KEYSTORE
      # ==========================================================
      - name: Generate Release Keystore
        run: |
          keytool -genkey -v -keystore release.keystore -alias release -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass password -keypass password \
            -dname "CN=BuildBot, OU=Dev, O=BuildBot, L=City, S=State, C=ID"

      # ==========================================================
      # 4. EXTRACT & NORMALIZE FLUTTER PROJECT
      # ==========================================================
      - name: Extract & Normalize Project
        if: env.type == 'flutter'
        run: |
          rm -rf flutter-project
          mkdir -p flutter-project

          if [ ! -f flutter-project.zip ]; then
            echo "❌ flutter-project.zip tidak ditemukan!"
            exit 1
          fi

          unzip -q flutter-project.zip -d flutter-project || {
            echo "❌ Gagal extract ZIP"
            exit 1
          }

          # Ratakan jika cuma 1 subfolder yang punya pubspec.yaml
          SUB_DIR_COUNT=$(find flutter-project -maxdepth 1 -mindepth 1 -type d | wc -l)
          FILE_COUNT=$(find flutter-project -maxdepth 1 -mindepth 1 -type f | wc -l)
          if [ "$SUB_DIR_COUNT" -eq 1 ] && [ "$FILE_COUNT" -eq 0 ]; then
            SUB_DIR=$(find flutter-project -maxdepth 1 -mindepth 1 -type d | head -n 1)
            if [ -f "$SUB_DIR/pubspec.yaml" ]; then
              TMP=$(mktemp -d)
              cp -R "$SUB_DIR"/. "$TMP"/
              rm -rf flutter-project
              mkdir -p flutter-project
              cp -R "$TMP"/. flutter-project/
            fi
          fi

          if [ ! -f flutter-project/pubspec.yaml ]; then
            echo "❌ pubspec.yaml tidak ditemukan"
            find flutter-project -maxdepth 3 -type f | head -50
            exit 1
          fi
          echo "✅ Project OK"

      # ==========================================================
      # 5. AUTO-DETECT FLUTTER VERSION
      # ==========================================================
      - name: Detect Flutter Version
        if: env.type == 'flutter'
        shell: bash
        run: |
          PUBSPEC="flutter-project/pubspec.yaml"
          SDK_LINE=$(grep -A3 '^environment:' "$PUBSPEC" | grep 'sdk:' | head -n1 | sed 's/.*sdk:[[:space:]]*//; s/["'\'']//g' || true)
          DART_VERSION=$(echo "$SDK_LINE" | grep -oE '[0-9]+\.[0-9]+' | head -n1 || echo "")
          echo "Dart constraint: $SDK_LINE (detected: $DART_VERSION)"

          FLUTTER_VERSION="3.32.0"
          case "$DART_VERSION" in
            "3.15"*|"3.14"*|"3.13"*|"3.12"*|"3.11"*|"3.10"*) FLUTTER_VERSION="3.35.2" ;;
            "3.9"*)  FLUTTER_VERSION="3.35.2" ;;
            "3.8"*)  FLUTTER_VERSION="3.32.0" ;;
            "3.7"*)  FLUTTER_VERSION="3.29.0" ;;
            "3.6"*)  FLUTTER_VERSION="3.27.0" ;;
            "3.5"*)  FLUTTER_VERSION="3.24.0" ;;
            "3.4"*)  FLUTTER_VERSION="3.22.0" ;;
            "3.3"*)  FLUTTER_VERSION="3.19.0" ;;
            "3.2"*)  FLUTTER_VERSION="3.16.0" ;;
            "3.1"*)  FLUTTER_VERSION="3.13.0" ;;
            "3.0"*)  FLUTTER_VERSION="3.10.0" ;;
          esac

          # Override berdasarkan plugin yang butuh Flutter tinggi
          if grep -Eq 'webview_flutter:[[:space:]]*(\^|>=)?(4\.1[5-9]|[5-9])' "$PUBSPEC" || \
             grep -Eq 'geolocator:[[:space:]]*(\^|>=)?1[4-9]\.' "$PUBSPEC" || \
             grep -Eq 'firebase_core:[[:space:]]*(\^|>=)?3\.' "$PUBSPEC" || \
             grep -Eq 'image_picker:[[:space:]]*(\^|>=)?1\.(2[0-9]|[3-9][0-9])' "$PUBSPEC" || \
             grep -Eq 'file_picker:[[:space:]]*(\^|>=)?[8-9]\.' "$PUBSPEC" || \
             grep -Eq 'permission_handler:[[:space:]]*(\^|>=)?12\.' "$PUBSPEC"; then
            FLUTTER_VERSION="3.35.2"
          fi

          echo "FLUTTER_VERSION=$FLUTTER_VERSION" >> $GITHUB_ENV
          echo "🎯 Flutter: $FLUTTER_VERSION"

      - name: Setup Flutter SDK
        if: env.type == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # ==========================================================
      # 6. FIX APP ICONS
      # ==========================================================
      - name: Fix App Icons
        if: env.type == 'flutter'
        run: |
          cd flutter-project
          MIPMAP_DIRS="mipmap-hdpi mipmap-mdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi"
          NEEDS_REGEN=false
          for dir in $MIPMAP_DIRS; do
            PNG="android/app/src/main/res/$dir/ic_launcher.png"
            if [ ! -f "$PNG" ] || ! file "$PNG" | grep -q PNG || ! identify "$PNG" &>/dev/null; then
              NEEDS_REGEN=true
              break
            fi
          done
          if [ "$NEEDS_REGEN" = "false" ]; then
            echo "✅ Icons valid, skip."
            exit 0
          fi
          echo "🔧 Regenerating icons..."
          if [ -f ../build-assets/icon.png ] && file ../build-assets/icon.png | grep -q PNG; then
            ICON_SRC="../build-assets/icon.png"
          else
            convert -size 512x512 xc:blue ../build-assets/icon.png
            ICON_SRC="../build-assets/icon.png"
          fi
          for pair in "hdpi 72" "mdpi 48" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $pair
            DIR="android/app/src/main/res/mipmap-$1"
            mkdir -p $DIR
            convert "$ICON_SRC" -resize ${2}x${2} $DIR/ic_launcher.png
            cp $DIR/ic_launcher.png $DIR/ic_launcher_round.png
          done
          echo "✅ Icons regenerated."

      # ==========================================================
      # 7. FIX ANDROID CONFIG
      # ==========================================================
      - name: Fix Android Config
        if: env.type == 'flutter'
        run: |
          cd flutter-project/android/app
          cp ../../../release.keystore . 2>/dev/null || true
          for f in build.gradle build.gradle.kts; do
            [ -f "$f" ] || continue
            sed -i -E 's/(compileSdk(Version)?)[[:space:]]*=?[[:space:]]*[0-9]+/\1 34/g' "$f" || true
            sed -i -E 's/(targetSdk(Version)?)[[:space:]]*=?[[:space:]]*[0-9]+/\1 34/g' "$f" || true
            sed -i 's|storeFile file(".*")|storeFile file("release.keystore")|g' "$f" || true
            sed -i 's|storeFile = file(".*")|storeFile = file("release.keystore")|g' "$f" || true
            sed -i 's|storePassword ".*"|storePassword "password"|g' "$f" || true
            sed -i 's|storePassword = ".*"|storePassword = "password"|g' "$f" || true
            sed -i 's|keyAlias ".*"|keyAlias "release"|g' "$f" || true
            sed -i 's|keyAlias = ".*"|keyAlias = "release"|g' "$f" || true
            sed -i 's|keyPassword ".*"|keyPassword "password"|g' "$f" || true
            sed -i 's|keyPassword = ".*"|keyPassword = "password"|g' "$f" || true
          done
          echo "✅ Android config fixed."

      # ==========================================================
      # 8. PATCH AGP + KOTLIN (auto-match dengan Flutter version)
      # ==========================================================
      - name: Patch AGP & Kotlin
        if: env.type == 'flutter'
        shell: bash
        run: |
          cd flutter-project
          FLUTTER_VERSION=$(flutter --version 2>/dev/null | grep -oE 'Flutter [0-9]+\.[0-9]+\.[0-9]+' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1 || echo "3.24.0")
          FLUTTER_MINOR=$(echo "$FLUTTER_VERSION" | cut -d. -f2)
          [ -z "$FLUTTER_MINOR" ] && FLUTTER_MINOR=0
          echo "Flutter: $FLUTTER_VERSION (minor=$FLUTTER_MINOR)"

          TARGET_AGP="8.7.0"
          TARGET_KOTLIN="2.1.0"
          if [ "$FLUTTER_MINOR" -ge 35 ] 2>/dev/null; then
            TARGET_AGP="8.11.1"; TARGET_KOTLIN="2.2.20"
          elif [ "$FLUTTER_MINOR" -ge 30 ] 2>/dev/null; then
            TARGET_AGP="8.9.1"; TARGET_KOTLIN="2.1.0"
          elif [ "$FLUTTER_MINOR" -ge 25 ] 2>/dev/null; then
            TARGET_AGP="8.7.0"; TARGET_KOTLIN="2.1.0"
          elif [ "$FLUTTER_MINOR" -ge 20 ] 2>/dev/null; then
            TARGET_AGP="8.3.0"; TARGET_KOTLIN="1.9.0"
          else
            TARGET_AGP="7.4.2"; TARGET_KOTLIN="1.8.22"
          fi
          echo "🎯 Target AGP=$TARGET_AGP Kotlin=$TARGET_KOTLIN"

          # Patch settings.gradle(.kts)
          for f in android/settings.gradle android/settings.gradle.kts; do
            [ -f "$f" ] || continue
            sed -i -E "s|(id[[:space:]]*\(?[[:space:]]*[\"']com\.android\.application[\"'][[:space:]]*\)?[[:space:]]+version[[:space:]]+)[\"'][0-9.]+[\"']|\1\"${TARGET_AGP}\"|g" "$f" || true
            sed -i -E "s|(id[[:space:]]*\(?[[:space:]]*[\"']com\.android\.library[\"'][[:space:]]*\)?[[:space:]]+version[[:space:]]+)[\"'][0-9.]+[\"']|\1\"${TARGET_AGP}\"|g" "$f" || true
            sed -i -E "s|(id[[:space:]]*\(?[[:space:]]*[\"']org\.jetbrains\.kotlin\.android[\"'][[:space:]]*\)?[[:space:]]+version[[:space:]]+)[\"'][0-9.]+[\"']|\1\"${TARGET_KOTLIN}\"|g" "$f" || true
          done

          # Patch android/build.gradle
          if [ -f android/build.gradle ]; then
            sed -i -E "s|com\.android\.tools\.build:gradle:[0-9.]+|com.android.tools.build:gradle:${TARGET_AGP}|g" android/build.gradle || true
            sed -i -E "s|ext\.kotlin_version[[:space:]]*=[[:space:]]*[\"'][0-9.]+[\"']|ext.kotlin_version = '${TARGET_KOTLIN}'|g" android/build.gradle || true
          fi
          echo "✅ AGP/Kotlin patched."

      # ==========================================================
      # 9. SYNC GRADLE WRAPPER DENGAN AGP
      # ==========================================================
      - name: Sync Gradle Wrapper
        if: env.type == 'flutter'
        shell: bash
        run: |
          cd flutter-project/android
          AGP_VER=""
          for f in build.gradle build.gradle.kts app/build.gradle app/build.gradle.kts settings.gradle settings.gradle.kts; do
            [ -f "$f" ] || continue
            V=$(grep -oP "com\.android\.tools\.build:gradle:\K[0-9]+\.[0-9]+(\.[0-9]+)?" "$f" 2>/dev/null | head -n1 || true)
            [ -z "$V" ] && V=$(grep -oP "id\(['\"]com\.android\.application['\"]\)\s+version\s+['\"]?\K[0-9]+\.[0-9]+(\.[0-9]+)?" "$f" 2>/dev/null | head -n1 || true)
            if [ -n "$V" ]; then AGP_VER="$V"; break; fi
          done
          [ -z "$AGP_VER" ] && AGP_VER="8.7.0"
          MAJOR=$(echo $AGP_VER | cut -d. -f1)
          MINOR=$(echo $AGP_VER | cut -d. -f2)
          case "${MAJOR}.${MINOR}" in
            8.11) GRADLE_REQ="8.13" ;;
            8.10) GRADLE_REQ="8.11.1" ;;
            8.9)  GRADLE_REQ="8.11.1" ;;
            8.8)  GRADLE_REQ="8.10.2" ;;
            8.7)  GRADLE_REQ="8.9" ;;
            8.6)  GRADLE_REQ="8.7" ;;
            8.5)  GRADLE_REQ="8.7" ;;
            8.4)  GRADLE_REQ="8.6" ;;
            8.3)  GRADLE_REQ="8.4" ;;
            8.2)  GRADLE_REQ="8.2" ;;
            8.1)  GRADLE_REQ="8.0" ;;
            8.0)  GRADLE_REQ="8.0" ;;
            7.*)  GRADLE_REQ="7.6.3" ;;
            *)    GRADLE_REQ="8.9" ;;
          esac
          echo "🎯 AGP=$AGP_VER → Gradle=$GRADLE_REQ"
          mkdir -p gradle/wrapper
          cat > gradle/wrapper/gradle-wrapper.properties <<PROPS_EOF
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https://services.gradle.org/distributions/gradle-${GRADLE_REQ}-all.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          PROPS_EOF
          chmod +x gradlew 2>/dev/null || true
          cat gradle/wrapper/gradle-wrapper.properties

      # ==========================================================
      # 10. FLUTTER PUB GET (retry + auto-fix)
      # ==========================================================
      - name: Flutter pub get
        if: env.type == 'flutter'
        shell: bash
        run: |
          cd flutter-project
          PUB_LOG="pubget.log"
          MAX=5
          N=0
          SUCCESS=false

          auto_fix() {
            echo "=== Auto-fixing pubspec.yaml ==="
            FIXED=false
            if grep -qE "requires SDK version|requires Dart SDK" "$PUB_LOG" 2>/dev/null; then
              sed -i -E "s|sdk:[[:space:]]*['\"]?[>=^~ ]*3\.[0-9.]+[^'\"]*['\"]?|sdk: '>=3.6.0 <4.0.0'|g" pubspec.yaml || true
              FIXED=true
            fi
            if grep -q "webview_flutter" "$PUB_LOG" 2>/dev/null && grep -q "requires SDK" "$PUB_LOG" 2>/dev/null; then
              sed -i -E "s|webview_flutter:[[:space:]]*[^[:space:]]+|webview_flutter: ^4.13.0|g" pubspec.yaml || true
              FIXED=true
            fi
            if grep -q "geolocator" "$PUB_LOG" 2>/dev/null && grep -qE "toARGB32|geolocator_android" "$PUB_LOG" 2>/dev/null; then
              sed -i -E "s|geolocator:[[:space:]]*[^[:space:]]+|geolocator: ^13.0.4|g" pubspec.yaml || true
              FIXED=true
            fi
            if grep -q "firebase_core" "$PUB_LOG" 2>/dev/null && grep -q "requires SDK" "$PUB_LOG" 2>/dev/null; then
              sed -i -E "s|firebase_core:[[:space:]]*[^[:space:]]+|firebase_core: ^2.32.0|g" pubspec.yaml || true
              FIXED=true
            fi
            if grep -q "image_picker" "$PUB_LOG" 2>/dev/null && grep -q "requires SDK" "$PUB_LOG" 2>/dev/null; then
              sed -i -E "s|image_picker:[[:space:]]*[^[:space:]]+|image_picker: ^1.1.2|g" pubspec.yaml || true
              FIXED=true
            fi
            if grep -q "file_picker" "$PUB_LOG" 2>/dev/null && grep -q "requires SDK" "$PUB_LOG" 2>/dev/null; then
              sed -i -E "s|file_picker:[[:space:]]*[^[:space:]]+|file_picker: ^6.2.1|g" pubspec.yaml || true
              FIXED=true
            fi
            if grep -q "permission_handler" "$PUB_LOG" 2>/dev/null && grep -q "requires SDK" "$PUB_LOG" 2>/dev/null; then
              sed -i -E "s|permission_handler:[[:space:]]*[^[:space:]]+|permission_handler: ^11.3.1|g" pubspec.yaml || true
              FIXED=true
            fi
            if grep -q "flutter_local_notifications" "$PUB_LOG" 2>/dev/null && grep -q "requires SDK" "$PUB_LOG" 2>/dev/null; then
              sed -i -E "s|flutter_local_notifications:[[:space:]]*[^[:space:]]+|flutter_local_notifications: ^17.2.4|g" pubspec.yaml || true
              FIXED=true
            fi
            if grep -q "workmanager" "$PUB_LOG" 2>/dev/null && grep -q "requires SDK" "$PUB_LOG" 2>/dev/null; then
              sed -i -E "s|workmanager:[[:space:]]*[^[:space:]]+|workmanager: ^0.5.2|g" pubspec.yaml || true
              FIXED=true
            fi
            if grep -q "overrides" "$PUB_LOG" 2>/dev/null; then
              sed -i '/^dependency_overrides:/,/^[^ ]/d' pubspec.yaml || true
              FIXED=true
            fi
            [ "$FIXED" = "true" ] && rm -f pubspec.lock
          }

          while [ $N -lt $MAX ] && [ "$SUCCESS" = "false" ]; do
            N=$((N+1))
            echo "===== pub get attempt $N / $MAX ====="
            if flutter pub get 2>&1 | tee "$PUB_LOG"; then
              SUCCESS=true
              echo "✅ pub get OK"
            else
              echo "❌ pub get failed, auto-fixing..."
              auto_fix
              rm -f pubspec.lock
            fi
          done
          [ "$SUCCESS" = "false" ] && { echo "❌ pub get failed"; cat "$PUB_LOG"; exit 1; }

      # ==========================================================
      # 11. FLUTTER ANALYZE (informative)
      # ==========================================================
      - name: Flutter Analyze
        if: env.type == 'flutter'
        continue-on-error: true
        run: |
          cd flutter-project
          echo "=== Flutter Analyze (informative) ==="
          flutter analyze 2>&1 | head -100 || true

      # ==========================================================
      # 12. BUILD APK
      # ==========================================================
      - name: Build APK
        if: env.type == 'flutter'
        shell: bash
        run: |
          cd flutter-project
          MODE="${build_type:-release}"
          echo "=== Building APK ($MODE) ==="
          if [ "$MODE" = "release" ]; then
            flutter build apk --release
          else
            flutter build apk --debug
          fi
          echo "✅ Build done"
          ls -la build/app/outputs/flutter-apk/ || true

      # ==========================================================
      # 13. SIGN APK (release only)
      # ==========================================================
      - name: Sign APK
        if: env.type == 'flutter' && env.build_type == 'release'
        run: |
          APK=$(find flutter-project/build/app/outputs/flutter-apk -name "*.apk" | head -n1)
          if [ -f "$APK" ]; then
            BT=$(ls $ANDROID_HOME/build-tools | sort -V | tail -n1)
            echo "Signing: $APK"
            $ANDROID_HOME/build-tools/$BT/apksigner sign --ks release.keystore --ks-pass pass:password --key-pass pass:password "$APK" || true
            $ANDROID_HOME/build-tools/$BT/apksigner verify "$APK" || true
          fi

      # ==========================================================
      # 14. COLLECT APK
      # ==========================================================
      - name: Collect APK
        run: |
          mkdir -p output
          APK=$(find flutter-project/build/app/outputs/flutter-apk -name "*.apk" | head -n1)
          if [ -z "$APK" ]; then
            echo "❌ APK tidak ditemukan!"
            find . -name "*.apk" || true
            exit 1
          fi
          cp "$APK" output/app-release.apk
          ls -la output/

      # ==========================================================
      # 15. UPLOAD ARTIFACT
      # ==========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: output/app-release.apk
          retention-days: 1
          if-no-files-found: error
